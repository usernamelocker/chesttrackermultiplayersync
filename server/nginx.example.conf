# adapt server_name + paths
server {
    listen 80;
    server_name cmsync.example.com;
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name cmsync.example.com;
    ssl_certificate /etc/letsencrypt/live/cmsync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cmsync.example.com/privkey.pem;

    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
