services:
  cmsync:
    build: .
    image: cmsync:latest
    container_name: cmsync
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      EXPECTED_SERVER_ID: ${EXPECTED_SERVER_ID}
      SERVER_ID_ALIASES: ${SERVER_ID_ALIASES:-}
      WHITELIST_UUIDS: ${WHITELIST_UUIDS:-}
      SHARED_TOKEN: ${SHARED_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DB_PATH: /data/cmsync.db
      SNAPSHOT_INTERVAL_MIN: ${SNAPSHOT_INTERVAL_MIN:-15}
      SNAPSHOT_KEEP: ${SNAPSHOT_KEEP:-96}
      MAX_DELETE_FRACTION: ${MAX_DELETE_FRACTION:-0.20}
      MAX_DELETE_COUNT: ${MAX_DELETE_COUNT:-50}
      TOMBSTONE_TTL_DAYS: ${TOMBSTONE_TTL_DAYS:-30}
    volumes:
      - cmsync-data:/data
      - cmsync-backups:/app/backups

volumes:
  cmsync-data:
  cmsync-backups:
